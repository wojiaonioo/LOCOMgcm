# Speed benchmark: South China Sea 1280 x 1216 x 90 grid, hydrostatic, 15 s step, 6 model hours; LOCOMgcm and MITgcm timed on the same configuration.
schema_version: 0.1.0
run:
  experiment_name: scs-bench
  device: cpu
  preprocess: true
  start_date: 2019-07-15

grid:
  nx: 1280
  ny: 1216
  nz: 90
  center_lat: 15.75
  center_lon: 114.0
  resolution_deg: 0.0234375
  depth_m: 5500
  vertical_layer_thicknesses:
    - 5
    - 5
    - 5
    - 5
    - 5
    - 5
    - 5
