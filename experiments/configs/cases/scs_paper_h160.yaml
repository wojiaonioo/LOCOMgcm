# South China Sea (99-129E, 1.5-30N), 160 x 152 x 90 grid, hydrostatic, 29 days from 2019-07-15; LOCOMgcm compared with MITgcm.
schema_version: 0.1.0
run:
  experiment_name: scs-bench
  device: cuda
  preprocess: true
  start_date: 2019-07-15

grid:
  nx: 160
  ny: 152
  nz: 90
  center_lat: 15.75
  center_lon: 114.0
  resolution_deg: 0.1875
  depth_m: 5500
  vertical_layer_thicknesses:
