    s_ref: [33.76730916083651, 33.786566794940896, 33.80982585735309, 33.834850187823875, 33.869914970480856, 33.90922141046697, 33.94994160122209, 33.998087293664, 34.04873768542572, 34.10107120526392, 34.17494977325048, 34.28107348706311, 34.38202761107965, 34.45941835312321, 34.51359106694682, 34.54688106643878, 34.5699192386004, 34.59312753515013, 34.59876136055466, 34.60462419430397, 34.602096206428264, 34.59195641065352, 34.58156264571738, 34.57107309707998, 34.56038523541993, 34.54171957494161, 34.51458516901749, 34.49082415673416, 34.47000779156346, 34.44929635812227, 34.428802323269174, 34.41084460778298, 34.39507360702759, 34.38234029334405, 34.372700491781764, 34.36299823453508, 34.35325430844126, 34.34712325246364, 34.34514566344154, 34.34314700868838, 34.340076270428206, 34.351082361571585, 34.361855673271485, 34.372659037706484, 34.38354645874665, 34.40194483703918, 34.42049853899096, 34.43210060606975, 34.44380632197938, 34.451395055972604, 34.45909353499049, 34.46656093170506, 34.474063609064025, 34.481690958936895, 34.487252833506275, 34.492726340393006, 34.4981998790335, 34.50374606760769, 34.50914915532708, 34.512172815205695, 34.515114402907265, 34.51828125748706, 34.52130638037554, 34.52440695978792, 34.527574447239004, 34.53072870304398, 34.53397175763897, 34.537248320852136, 34.54047910278828, 34.54147990826197, 34.54530719866402, 34.55041239168236, 34.553661658034464, 34.553360858334585, 34.55282007087086, 34.55002581362682, 34.547135370772416, 34.54369583794725, 34.53935287794249, 34.53265941060132, 34.521910217694284, 34.50505707861054, 34.487728623293876, 34.47763934232425, 34.461242500122054, 34.43229491124826, 34.42206168486247, 34.405710096649514, 34.386081491613936, 34.35686093643264]
  era5:
    type: era5_netcdf
    path: external:era5_dir
  gebco:
    type: gebco_netcdf
    path: external:gebco_file

pipelines:
  stage1a_prepare_common:
  - name: state
    primary_source: hycom
    operators:
    - op: subset_vars
      vars:
      - temperature
      - salinity
      - u
      - v
      - eta
    - op: mask_land_sentinel
      flag_vars:
      - temperature
      - salinity
    - op: fill_edges
      dims:
      - z
    - op: vertical_interp
      target_grid: model_grid
      method: linear
    - op: grid_interp
      target_grid: model_grid
      method: bilinear
    - op: fill_edges
      dims:
      - longitude
      - latitude
      fillna: 0.0
    consumer: prepared_state_zarr
  - name: forcing
    primary_source: era5
    operators:
    - op: grid_interp
      target_grid: model_grid
      method: bilinear
    consumer: prepared_forcing_zarr
  - name: boundary
    primary_source: hycom
    operators:
    - op: subset_vars
      vars:
      - temperature
      - salinity
      - u
      - v
      - eta
    - op: mask_land_sentinel
      flag_vars:
      - temperature
      - salinity
    - op: fill_edges
      dims:
      - z
    - op: vertical_interp
      target_grid: model_grid
      method: linear
    - op: grid_interp
      target_grid: model_grid
      method: bilinear
    - op: fill_edges
      dims:
      - longitude
      - latitude
      fillna: 0.0
    - op: subset_boundary
      sides:
      - N
      - E
      - S
      - W
      width: 3
    consumer: prepared_boundary_zarr
  - name: mesh
    primary_source: gebco
    operators:
    - op: subset_to_domain
    - op: grid_interp
      target_grid: model_grid
      method: bilinear
    - op: convention_convert
      to: locomgcm
    consumer: prepared_mesh_zarr
  stage1b_export_to:
  - name: to_obc
    primary_source: stage1a_boundary
    operators:
    - op: convention_convert
      to: locomgcm
    consumer: locomgcm_obc_zarr
  stage1c_export_mit:
  - name: mit_bathy
    primary_source: stage1a_mesh
    operators:
    - op: bathy_clamp
      depth_max: 5500
    - op: convention_convert
      to: mitgcm
    consumer: mitgcm_bathy_binary
  - name: mit_ic
    primary_source: stage1a_initial_state
    operators: []
    consumer: mitgcm_ic_binary
  - name: mit_obc
    primary_source: stage1a_boundary
    operators:
    - op: convention_convert
      to: mitgcm
    consumer: mitgcm_obc_binary
  - name: mit_exf
    primary_source: stage1a_forcing
    operators:
    - op: wind_to_stress
    - op: convention_convert
      to: mitgcm
    consumer: mitgcm_exf_binary
  - name: mit_size
    primary_source: stage1a_mesh
    operators:
    - op: extract_mesh_dims
    - op: compute_mpi_topology
      target_nProcs: 40
    consumer: mitgcm_size_h
    consumer_config:
      nz: 90
  - name: mit_data
    primary_source: stage1a_initial_state
    operators: []
    consumer: mitgcm_data_namelist
  - name: mit_eedata
    primary_source: stage1a_initial_state
    operators: []
    consumer: mitgcm_eedata
  - name: mit_topology
    primary_source: stage1a_mesh
    operators:
    - op: compute_mpi_topology
      target_nProcs: 40
    consumer: mitgcm_topology
  - name: mit_exf_namelist
    primary_source: stage1a_boundary
    operators: []
    consumer: mitgcm_exf_namelist
    consumer_config:
      stress_period_hours: 6.0
  - name: mit_cal
    primary_source: stage1a_initial_state
    operators: []
    consumer: mitgcm_cal_namelist
  - name: mit_pkg
    primary_source: stage1a_initial_state
    operators: []
    consumer: mitgcm_pkg_namelist
    consumer_config:
      use_exf: true
      use_cal: false
  - name: mit_kpp
    primary_source: stage1a_initial_state
    operators: []
    consumer: mitgcm_kpp_namelist
  - name: mit_diagnostics
    primary_source: stage1a_initial_state
    operators: []
    consumer: mitgcm_diagnostics_namelist
  - name: mit_packages_conf
    primary_source: stage1a_mesh
    operators: []
    consumer: mitgcm_packages_conf
    consumer_config:
      packages:
      - gfd
      - obcs
      - kpp
      - exf
  - name: mit_obcs
    primary_source: stage1a_boundary
    operators: []
    consumer: mitgcm_obcs_namelist
  - name: mit_cpp_options
    primary_source: stage1a_mesh
    operators: []
    consumer: mitgcm_cpp_options
    consumer_config:
      extra_undefs:
        - ALLOW_DEBUG
      extra_defines:
        - EXACT_CONSERV
        - SHORTWAVE_HEATING
  - name: mit_exf_options
    primary_source: stage1a_mesh
    operators: []
    consumer: mitgcm_exf_options
  - name: mit_obcs_options
    primary_source: stage1a_mesh
    operators: []
    consumer: mitgcm_obcs_options

case:
  kind: regional
  extras:
    framework: true
    ic_source: zarr_bundle
    ic_source_extras:
      stage1b_consumer: locomgcm_ic_zarr
    obcs_source: zarr_bundle
    obcs_source_extras:
      stage1b_consumer: locomgcm_obc_zarr
    forcing_source: era5_netcdf
    forcing_source_extras:
      time_mode: linear
    case_type: hycom_comparison
    case_name: scs-hires
    description: LOCOMgcm vs MITgcm comparison for SCS high-resolution 1/24° run
    west_east_boundary: open
    south_north_boundary: open
    grid_mode: spherical_polar
    r_sphere: 6370000.0
    hfac_min: 0.2
    hfac_min_dz: 0.0
    obcs_sides:
    - N
    - E
    - S
    - W
    obcs_along: 160

model:
  dynamics:
  - name: linear_free_surface_continuity
  - name: linear_free_surface_pressure_gradient
    kwargs:
      gravity: 9.81
  - name: horizontal_tracer_advection
    kwargs:
      scheme: dst3_fl
      tracer_names: [temp, salt]
      multi_dim: true
      use_advective_form: false
      dt: 120.0
      obcs_upwind: false
  - name: vector_invariant_momentum_advection
    kwargs:
      coriolis_parameter: $coriolis_parameter
      coriolis_profile_g: $coriolis_profile_g
      enable_vertical_shear: false
      split_coriolis: true
      select_ke_scheme: 0
  - name: era5_wind_forcing
    kwargs:
      reference_density: 1025.0
  - name: bottom_drag
    kwargs:
      linear: 2.0e-4
      quadratic: 0.0025
      vertical_viscosity: 0.001
  - name: surface_heat_salt_flux
    kwargs:
      lin_fs_conserve_tr: false
  - name: tracer_boundary_sponge_relaxation
    kwargs:
      width: 3
      timescale_seconds: 3600.0
      timescale_inner_seconds: 259200.0
      sponge_mode: mitgcm
      use_linear_sponge: false
      time_mode: linear
      ab2_eligible: false
  - name: momentum_boundary_sponge_relaxation
    kwargs:
      width: 3
      timescale_seconds: 3600.0
      timescale_inner_seconds: 259200.0
      sponge_mode: mitgcm
      use_linear_sponge: false
      time_mode: linear
      balance_obcs_targets: true
      zero_tangential_targets: false
  - name: horizontal_viscosity
    kwargs:
      viscosity: 500.0
      no_slip_sides: false
      viscosity_scheme: leith_smag
      visc_c2_leith: 1.0
      visc_c2_smag: 3.0
  - name: horizontal_tracer_diffusion
    kwargs:
      diffusivity: 100.0
      tracer_names: [temp, salt]
  - name: jmd95_equation_of_state
    kwargs:
      reference_density: 1025.0
      dynamic_pressure: true
  - name: hydrostatic_pressure_gradient
    kwargs:
      gravity: 9.81
      reference_density: 1025.0
  - name: diagnostic_vertical_velocity
  stepper:
    name: implicit_free_surface
    kwargs:
      gravity: 9.81
      implicit_surf_press: 1.0
      implicit_div_2d_flow: 1.0
      implicit_viscosity: 0.001
      nonlin_free_surf: 0
      select_r_star: 0
      stagger_tracer_stepping: true
      mom_forcing_out_ab: true
      ab_eps: 0.1
      ab2_on_tracer_tendency: false
      exact_conserv: true
      implicit_tracer_diffusion: true
      tracer_vertical_diffusivity_kr: 1.0e-05
      kpp_enabled: true

      kpp_sign_zero: positive
      nonhydrostatic:
        nonhydrostatic: false
        cg3d_max_iters: 150
        cg3d_target_residual: 1.0e-07
        cg3d_target_res_w_unit: -1.0
        nh_am2: 1.0
  boundary_condition:
    name: prescribed_3d
    kwargs:
      use_barotropic_source: true
      time_mode: linear
      tangential_zero_mode: none
      enforce_obcs_balance: true
      apply_tangential_velocity: true

checkpoint:
  enabled: true
  every_steps: 720
  keep_last: 2
  backend: thread
