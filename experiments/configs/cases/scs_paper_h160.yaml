time:
  days: 29
  dt: 120
  dt_mom: 120
  dt_freesurf: 120
  dt_tracer: 120
  dt_clock: 120

mit_parallel:
  nPx: 5
  nPy: 8
  sNx: null
  sNy: null
  OLx: 4
  OLy: 4

physics:
  nonlin_free_surf: 0
  enable_vertical_shear: false
  split_coriolis: true
  nonhydrostatic:
    enabled: false
  viscosity: 500.0
  viscosity_scheme: leith_smag
  diffusivity: 100.0
  implicit_viscosity: 0.001
  implicit_vertical_advection:
    temperature: true
    salinity: true
    momentum: true
  tracer:
    implicit_vertical_diffusion: true
    diffusivity_kr: 1.0e-05
  ke_scheme: 0

advection:
  vertical: upwind
  tracer: dst3_fl
  multi_dim: true

boundary:
  type: open
  scheme: clamped
  sides:
  - N
  - E
  - S
  - W
  sponge_width: 3
  sponge_mode: mitgcm
  sponge_timescale_hours: 1
  sponge_timescale_inner_hours: 72

mit_comparison:
  enabled: true
  sync_from_to: true
  viscA4: 0.0

cache:
  root: outputs/data/_cache
  reuse: true
  cleanup_policy: never

output:
  root: outputs/data
  legacy_layout: true
  monitor_interval_steps: 180
  nc_output_interval_hours: 6.0
  snapshot_interval_hours: 6.0

observations:
  section_transport_u: {i_face: 82, j0: 99, j1: 112}

sources:
  hycom:
    type: hycom_netcdf
    path: external:hycom_dir
    start_date: 2019-07-15
    # tRef, sRef: the layer means of the prepared initial state the paper run
    # resolved (resolve_reference_profiles), stated so that they do not follow
    # a later preparation of that state.
